<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080510" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Blasters" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/blaster-icon.svg" />
    <title>Blasters · Co-op</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://storage.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://storage.googleapis.com" />
    <link rel="preload" href="/mediapipe-wasm/vision_wasm_internal.js" as="script" />
    <link rel="preload" href="/mediapipe-wasm/vision_wasm_internal.wasm" as="fetch" type="application/wasm" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <div id="game-container">
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="game-canvas"></canvas>
      <div id="ui-layer">
        <div id="hud-game" class="hud-game is-hidden">
          <div id="game-over-overlay" class="game-over-overlay is-hidden" aria-live="assertive">
            <span data-i18n="gameOver">GAME OVER</span>
          </div>
          <div id="victory-overlay" class="victory-overlay is-hidden" aria-live="polite">
            <span data-i18n="victory">Победа!</span>
          </div>
          <div id="campaign-complete-overlay" class="campaign-complete-overlay is-hidden" aria-live="polite">
            <div class="campaign-complete-panel">
              <h2 class="campaign-complete-title" data-i18n="youWon">Ты победил!</h2>
              <p id="campaign-score-line" class="campaign-score-line"></p>
              <p id="campaign-rank-line" class="campaign-rank-line"></p>
              <div class="leaderboard-block">
                <div class="leaderboard-title" data-i18n="leaderboardTitle">Топ-10 на этом устройстве</div>
                <ol id="leaderboard-list" class="leaderboard-list"></ol>
              </div>
              <button type="button" id="btn-campaign-menu" class="btn-start btn-campaign-menu" data-i18n="btnBackMenu">Меню</button>
            </div>
          </div>
          <h1 id="score-display">Score: 0</h1>
          <div class="hud-row">
            <span id="level-display">Уровень: 1</span>
            <span id="players-display"></span>
          </div>
          <button type="button" id="btn-back-menu" class="btn-menu btn-back-menu" data-i18n="btnBackMenu">Меню</button>
        </div>
        <div id="main-menu" class="menu-overlay is-hidden">
          <div class="menu-top-bar">
            <button type="button" id="btn-fullscreen" class="btn-fullscreen" hidden>
              <span class="btn-fullscreen-on" aria-hidden="true">⛶</span>
              <span class="btn-fullscreen-off" aria-hidden="true">⛶</span>
              <span class="btn-fullscreen-label" data-i18n="fullscreen">На весь экран</span>
            </button>
            <div class="menu-corner-panel">
              <div class="menu-corner-panel-title" data-i18n="cornerLangTitle">ЯЗЫК</div>
              <div class="menu-lang" role="radiogroup" aria-label="Language">
                <label class="menu-lang-pill">
                  <input type="radio" name="blasters-lang" id="opt-lang-ru" value="ru" checked />
                  <span>RU</span>
                </label>
                <label class="menu-lang-pill">
                  <input type="radio" name="blasters-lang" id="opt-lang-en" value="en" />
                  <span>EN</span>
                </label>
              </div>
            </div>
            <div class="menu-corner-panel">
              <div class="menu-corner-panel-title" data-i18n="cornerPlayersTitle">ИГРОКИ</div>
              <div
                class="menu-player-quick"
                role="group"
                id="players-count-group"
                aria-label="Игроков на камере"
              >
                <button type="button" id="btn-players-1" class="btn-player-count" aria-pressed="false">1</button>
                <button type="button" id="btn-players-2" class="btn-player-count" aria-pressed="true">2</button>
              </div>
            </div>
          </div>
          <div class="menu-panel">
            <div class="menu-poster-wrap">
              <img id="menu-poster" class="menu-poster" alt="Blasters" width="1200" height="675" />
            </div>
            <div class="menu-cta">
              <button type="button" id="btn-start" class="btn-start" data-i18n="btnStart">Играть</button>
            </div>
            <div class="menu-options" role="group">
              <div class="menu-options-title" data-i18n="optionsTitle">Звук и музыка</div>
              <div class="menu-volume-row">
                <div class="menu-volume-head">
                  <span data-i18n="volSfx">Громкость эффектов</span>
                  <span class="menu-volume-value" id="vol-sfx-val">100%</span>
                </div>
                <input type="range" id="vol-sfx" min="0" max="100" value="100" step="1" class="menu-volume-slider" aria-label="SFX volume" />
              </div>
              <div class="menu-volume-row">
                <div class="menu-volume-head">
                  <span data-i18n="volMusic">Громкость музыки</span>
                  <span class="menu-volume-value" id="vol-music-val">100%</span>
                </div>
                <input type="range" id="vol-music" min="0" max="100" value="100" step="1" class="menu-volume-slider" aria-label="Music volume" />
              </div>
            </div>
          </div>
        </div>
        <div id="loading" class="visible">
          <div id="loading-logo" aria-hidden="true">⌖</div>
          <div id="loading-text">Загрузка моделей…</div>
          <div id="progress-container">
            <div id="progress-bar"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
